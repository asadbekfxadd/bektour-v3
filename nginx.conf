server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # Заголовки безопасности
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Strict-Transport-Security "max-age=31536000" always;

  # Сжатие
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/xml application/json application/javascript application/xml image/svg+xml;

  # Служебные файлы репозитория не отдаём
  location ~ ^/(Dockerfile|nginx\.conf|\.dockerignore|\.git|README) { return 404; }
  location ~ /\. { return 404; }

  # Закрытые страницы не индексируем
  location ~ ^/(admin|dashboard|register|properties|property-form)\.html$ {
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
  }

  # Статика: картинки, шрифты, стили, скрипты кэшируются
  location ~* \.(webp|jpg|jpeg|png|svg|ico|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000" always;
    add_header X-Content-Type-Options "nosniff" always;
  }
  location ~* \.(css|js)$ {
    expires 1d;
    add_header Cache-Control "public, max-age=86400, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  # data/*.json читает сайт — всегда свежие
  location /data/ {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  location / {
    try_files $uri $uri.html $uri/ =404;
  }
}
